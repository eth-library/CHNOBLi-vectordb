[project]
name = "vectordb_operations"
version = "1.2.0"
description = "Small package that enables milvus operations"
readme = "README.md"
authors = [{ name = "Lukas von Ziegler", email = "lukasv@ethz.ch" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymilvus[bulk-writer]>=2.6.3,<3",
    "numpy>=2.3.5,<3",
    "scipy>=1.16.3,<2",
    "h5py>=3.16.0,<4",
    "pyarrow>=23.0.1,<24",
    "pydantic>=2.13.0,<3",
    "pydantic-settings>=2.13.1,<3",
    "pytest>=9.0.2,<10",
    "boto3>=1.42.89,<2",
    "rich>=15.0.0,<16",
    "argcomplete>=3.6.3,<4",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
milvus_dump = "vectordb_operations.cli:main"
